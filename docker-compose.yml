name: venueflow

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-venueflow}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --username
        - ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
        - --password
        - ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
        - --authenticationDatabase
        - admin
        - --eval
        - "quit(db.adminCommand('ping').ok ? 0 : 2)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  yolo:
    build:
      context: ./yolo-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      YOLO_MODEL_PATH: /opt/models/yolo11s.pt
      YOLO_CONFIDENCE: ${YOLO_CONFIDENCE:-0.12}
      YOLO_IOU: ${YOLO_IOU:-0.70}
      YOLO_IMAGE_SIZE: ${YOLO_IMAGE_SIZE:-960}
      YOLO_TILED_INFERENCE: ${YOLO_TILED_INFERENCE:-true}
      YOLO_TILE_SLICES: ${YOLO_TILE_SLICES:-3}
      YOLO_TILE_OVERLAP: ${YOLO_TILE_OVERLAP:-0.15}
      YOLO_MAX_DETECTIONS: ${YOLO_MAX_DETECTIONS:-120}
      YOLO_MAX_UPLOAD_BYTES: ${YOLO_MAX_UPLOAD_BYTES:-8388608}
      YOLO_MAX_IMAGE_PIXELS: ${YOLO_MAX_IMAGE_PIXELS:-25000000}
      YOLO_MAX_VIDEO_UPLOAD_BYTES: ${YOLO_MAX_VIDEO_UPLOAD_BYTES:-209715200}
      YOLO_MAX_VIDEO_PIXELS: ${YOLO_MAX_VIDEO_PIXELS:-25000000}
      YOLO_MAX_VIDEO_DURATION_SECONDS: ${YOLO_MAX_VIDEO_DURATION_SECONDS:-1800}
      YOLO_VIDEO_JPEG_QUALITY: ${YOLO_VIDEO_JPEG_QUALITY:-88}
      YOLO_TORCH_THREADS: ${YOLO_TORCH_THREADS:-2}
      YOLO_API_KEY: ${YOLO_API_KEY:-}
    ports:
      - "127.0.0.1:${YOLO_PORT:-8000}:8000"
    cpus: "2.0"
    mem_limit: 3g
    shm_size: 256m
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: ${API_NODE_ENV:-development}
      PORT: "4000"
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}:${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}@mongo:27017/${MONGO_DATABASE:-venueflow}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      COOKIE_MAX_AGE_MS: ${COOKIE_MAX_AGE_MS:-604800000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      AUTO_SEED_OWNER: "true"
      SEED_OWNER_NAME: ${SEED_OWNER_NAME:-VenueFlow Owner}
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:?Set SEED_OWNER_EMAIL in .env}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:?Set SEED_OWNER_PASSWORD in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_PLAN_MODEL: ${OPENAI_PLAN_MODEL:-gpt-5.6}
      OPENAI_CAMERA_VISION_TIMEOUT_MS: ${OPENAI_CAMERA_VISION_TIMEOUT_MS:-35000}
      YOLO_API_URL: http://yolo:8000/detect
      YOLO_DETECT_TIMEOUT_MS: ${YOLO_DETECT_TIMEOUT_MS:-18000}
      YOLO_VIDEO_FRAME_URL: http://yolo:8000/video/frame
      YOLO_API_KEY: ${YOLO_API_KEY:-}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
      yolo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: ${FRONTEND_BUILD_TARGET:-production}
    restart: unless-stopped
    init: true
    environment:
      PORT: "5173"
      FRONTEND_INTERNAL_PORT: "3000"
      VENUEFLOW_API_URL: http://api:4000
      PROXY_TIMEOUT_MS: "120000"
      WRANGLER_WRITE_LOGS: "false"
      WRANGLER_LOG_PATH: .wrangler/logs
      MINIFLARE_REGISTRY_PATH: .wrangler/registry
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5173/overview').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mongo_data:
    name: venueflow_mongo_data
