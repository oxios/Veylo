name: venueflow

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-venueflow}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --username
        - ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
        - --password
        - ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
        - --authenticationDatabase
        - admin
        - --eval
        - "quit(db.adminCommand('ping').ok ? 0 : 2)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: ${API_NODE_ENV:-development}
      PORT: "4000"
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}:${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}@mongo:27017/${MONGO_DATABASE:-venueflow}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      COOKIE_MAX_AGE_MS: ${COOKIE_MAX_AGE_MS:-604800000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      AUTO_SEED_OWNER: "true"
      SEED_OWNER_NAME: ${SEED_OWNER_NAME:-VenueFlow Owner}
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:?Set SEED_OWNER_EMAIL in .env}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:?Set SEED_OWNER_PASSWORD in .env}
      VIDEO_STORAGE_DIR: /data/videos
      VIDEO_MAX_UPLOAD_BYTES: ${VIDEO_MAX_UPLOAD_BYTES:-2147483648}
      VIDEO_DELETE_AFTER_PROCESSING: ${VIDEO_DELETE_AFTER_PROCESSING:-true}
      CAMERA_SECRET_KEY: ${CAMERA_SECRET_KEY:?Set CAMERA_SECRET_KEY in .env}
      MEDIAMTX_SECRET: ${MEDIAMTX_SECRET:?Set MEDIAMTX_SECRET in .env}
      LOCAL_NODE_SECRET: ${LOCAL_NODE_SECRET:-}
      HUB_API_URL: http://mediamtx:9997
      HUB_WEBRTC_URL: http://mediamtx:8889
      # Address of the hub as remote nodes see it (rtsp://<public host>:8554 in production).
      HUB_RTSP_URL: ${HUB_RTSP_URL:-rtsp://mediamtx:8554}
      LIVE_TRACK_RETENTION_DAYS: ${LIVE_TRACK_RETENTION_DAYS:-7}
    volumes:
      - video_data:/data/videos
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # MediaMTX hub: relays live video from processing nodes to browsers (WebRTC). Publish/read are authorised by the API.
  mediamtx:
    image: bluenviron/mediamtx:1.21.1-ffmpeg
    restart: unless-stopped
    environment:
      MTX_AUTHHTTPADDRESS: http://api:4000/api/internal/mediamtx/auth?secret=${MEDIAMTX_SECRET:?Set MEDIAMTX_SECRET in .env}
      MTX_WEBRTCADDITIONALHOSTS: ${WEBRTC_PUBLIC_HOSTS:-127.0.0.1}
    volumes:
      - ./deploy/hub/mediamtx.yml:/mediamtx.yml:ro
    ports:
      # Remote nodes publish here; bind to a public interface in production (HUB_RTSP_BIND=0.0.0.0:8554).
      - "${HUB_RTSP_BIND:-127.0.0.1:8554}:8554"
      - "${WEBRTC_BIND:-127.0.0.1:8189}:8189/udp"
      - "${WEBRTC_BIND:-127.0.0.1:8189}:8189/tcp"
    depends_on:
      api:
        condition: service_healthy

  # Local processing node (same services as deploy/node, authenticated with LOCAL_NODE_SECRET).
  node-init:
    extends:
      file: deploy/node/docker-compose.yml
      service: node-init

  node-mediamtx:
    extends:
      file: deploy/node/docker-compose.yml
      service: node-mediamtx
    volumes:
      - ./deploy/node/mediamtx.yml:/mediamtx.yml:ro
      - recordings:/recordings
    depends_on:
      node-init:
        condition: service_completed_successfully

  camera-node:
    extends:
      file: deploy/node/docker-compose.yml
      service: camera-node
    build:
      context: ./camera-node
      args:
        TORCH_VARIANT: ${NODE_TORCH_VARIANT:-cpu}
    environment:
      VENUEFLOW_URL: http://api:4000
      NODE_TOKEN: vfn_local_${LOCAL_NODE_SECRET:?Set LOCAL_NODE_SECRET in .env}
      NODE_DEVICE: ${NODE_DEVICE:-auto}
    cpus: "${NODE_CPUS:-4.0}"
    mem_limit: 6g
    depends_on:
      node-mediamtx:
        condition: service_started
      api:
        condition: service_healthy

  # Development-only RTSP camera looping a public test video: docker compose --profile dev-camera up -d fake-camera
  fake-camera:
    image: bluenviron/mediamtx:1.21.1-ffmpeg
    profiles: ["dev-camera"]
    restart: unless-stopped
    volumes:
      - ./deploy/fake-camera/mediamtx.yml:/mediamtx.yml:ro
      - ./deploy/fake-camera/loop.sh:/fake/loop.sh:ro
      - fake_camera_media:/media

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: ${FRONTEND_BUILD_TARGET:-production}
    restart: unless-stopped
    init: true
    environment:
      PORT: "5173"
      FRONTEND_INTERNAL_PORT: "3000"
      VENUEFLOW_API_URL: http://api:4000
      PROXY_TIMEOUT_MS: "120000"
      WRANGLER_WRITE_LOGS: "false"
      WRANGLER_LOG_PATH: .wrangler/logs
      MINIFLARE_REGISTRY_PATH: .wrangler/registry
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5173/overview').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mongo_data:
    name: venueflow_mongo_data
  video_data:
    name: venueflow_video_data
  recordings:
    name: venueflow_node_recordings
  fake_camera_media:
    name: venueflow_fake_camera_media
